# Usuba 9B fine-tune: bf16 LoRA (NOT QLoRA) on 1x H100 80GB (A100 80GB fallback).
base_model: Qwen/Qwen3.5-9B          # post-trained (chat) checkpoint; its chat template is used for training and inference
train_file: data/train.jsonl
val_file: data/val.jsonl
output_dir: out/usuba-9b-lora
max_len: 12288                       # tokens; longer examples are dropped and counted (dry run shows how many)
lora: {r: 32, alpha: 64, dropout: 0.05}
# language-model linear layers only (attention + Gated DeltaNet projections + MLP); vision tower untouched
lora_target_suffixes: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_a, in_proj_b, out_proj, gate_proj, up_proj, down_proj]
epochs: 2
lr: 1.0e-4
warmup_ratio: 0.03
scheduler: cosine
weight_decay: 0.0
per_device_batch: 1
grad_accum: 16                       # effective batch 16 sequences
use_example_weight: true             # HANCORE strength weight (strong 1.0, likely 0.6, open 0.3) scales the loss
eval_every_steps: 100
save_every_steps: 25                 # full resumable checkpoint (~15 min on H100); synced off the instance by launch_vast.sh watch
keep_checkpoints: 3
max_hours: 9                         # hard stop (budget guard); trainer saves and exits
seed: 1337
