# Lint gate (audit J). Legacy code is brought under ruff file by file: add a file to `include` when it is clean.
line-length = 160
target-version = "py310"
include = ["scope/*.py", "scope/labelpage/*.py", "tools/preflight.py", "tools/recompute_guard_filter.py", "tools/gen_readme_tables.py", "tools/gen_notice.py", "tests/*.py"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "S", "E722", "BLE"]
ignore = ["S101", "S603", "S607", "S311"]

[lint.per-file-ignores]
"tests/*.py" = ["S", "E702", "E741"]
"scope/run_b0.py" = ["S310"]   # urlopen on a fixed https constant (the OpenRouter endpoint), never a user-supplied URL
"scope/build_drafts.py" = ["S404"]   # git subprocess with list args to fetch public commits
