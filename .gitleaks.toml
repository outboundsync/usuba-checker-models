[extend]
useDefault = true

[allowlist]
description = "Known false positives: keybind key fields, offline-replay dummy, redaction markers"
paths = [
  '''functest/fixtures/hyprland-0\.56\.2/.*\.json''',
  '''runs/rescore404/.*\.json''',
  '''dell-ref/.*''',
  '''\.gitleaks\.toml''',
]
regexes = [
  '''unused-offline-replay''',
  '''REDACTED_[A-Z_]+''',
]
