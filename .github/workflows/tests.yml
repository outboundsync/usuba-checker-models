name: tests
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pytest ruff pyyaml
      - name: 'CPU torch (weighted-loss gradient tests, audit A4/J - they must run in CI, not importorskip away)'
        run: pip install "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Lint (files listed in ruff.toml)
        run: ruff check
      - name: README tables, NOTICE and manifests are current
        run: |
          python3 tools/gen_readme_tables.py --check
          python3 tools/gen_notice.py --check
      - name: Unit tests (CPU only, no network, no model)
        run: python3 -m pytest -q --ignore=train/tests/test_loss_utils.py   # that test needs a tokenizer download; run it locally. Skips: the checker contract test (private sibling, see docs/PACKAGING.md)
      - name: Weighted-loss tests really ran (fail if they were skipped)
        run: |
          python3 -m pytest -q train/tests/test_train_utils.py train/tests/test_loss_cpu.py -rs 2>&1 | tee /tmp/loss.txt
          ! grep -qi "skipped" /tmp/loss.txt
